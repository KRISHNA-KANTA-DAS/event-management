{% extends 'base.html' %}
{% block content %}

<h2>Your Cart</h2>

{% for product in products %}
<p>{{ product.name }} - {{ product.quantity }} x ₹{{ product.price }} = ₹{{ product.subtotal }}</p>
{% endfor %}

<h3>Total: ₹{{ total }}</h3>

<a href="{% url 'checkout' %}" class="btn btn-success">Checkout</a>

{% endblock %}
