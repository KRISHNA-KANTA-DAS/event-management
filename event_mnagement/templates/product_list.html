<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
    <h2>All Products</h2>

{% extends 'base.html' %}
{% block content %}

<h2>Products</h2>

<div class="row">
{% for product in products %}
<div class="col-md-4">
  <div class="card mb-3">
    {% if product.image %}
    <img src="{{ product.image.url }}" class="card-img-top">
    {% endif %}
    <div class="card-body">
      <h5>{{ product.name }}</h5>
      <p>{{ product.description }}</p>
      <p>₹ {{ product.price }}</p>
      <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary">Add to Cart</a>
    </div>
  </div>
</div>
{% endfor %}
</div>

{% endblock %}



</body>
</html>
